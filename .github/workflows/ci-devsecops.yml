name: CI DevSecOps

on:
  push:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"
  # Menggunakan fallback yang lebih bersih untuk nama image
  CONTAINER_IMAGE: ${{ vars.CONTAINER_IMAGE || format('{0}/todo-python', secrets.DOCKERHUB_USERNAME) }}

jobs:
  # --- STAGE 1: TESTING ---
  unit_test:
    name: Unit Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "setuptools>=78.1.1,<79.0.0"
          pip install -r requirements.txt
      
      # Catatan: Tambahkan step 'pytest' di sini jika ingin benar-benar menjalankan test

  # --- STAGE 2: SECURITY SCANNING (PARALLEL) ---
  sast_bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: [unit_test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r app -f json -o bandit-report.json

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  sca_pip_audit:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    needs: [unit_test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict --progress-spinner=off --format json > pip-audit.json

      - name: Upload SCA Report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json

  secret_scan_gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: [unit_test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Penting untuk Gitleaks agar bisa scan history

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "--no-banner --report-format json --report-path gitleaks.json --exit-code 1"

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json

  # --- STAGE 3: BUILD AND PUSH ---
  build_and_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [sast_bandit, sca_pip_audit, secret_scan_gitleaks]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ env.CONTAINER_IMAGE }}:latest
            docker.io/${{ env.CONTAINER_IMAGE }}:${{ steps.vars.outputs.sha_short }}

      - name: Export built tag
        run: echo "BUILT_IMAGE=docker.io/${{ env.CONTAINER_IMAGE }}:${{ steps.vars.outputs.sha_short }}" >> $GITHUB_ENV
          

  # --- STAGE 4: POST-BUILD SECURITY ---
  image_scan_trivy:
    name: Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build_and_push]
    steps:
      - name: Run Trivy Scan (Table View)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: docker.io/${{ env.CONTAINER_IMAGE }}:${{ needs.build_and_push.outputs.sha_tag }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Generate Trivy SARIF Report
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: docker.io/${{ env.CONTAINER_IMAGE }}:${{ needs.build_and_push.outputs.sha_tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
